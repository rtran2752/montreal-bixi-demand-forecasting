[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "montreal-bixi-demand"
version = "1.0.0"
description = "End-to-end forecasting and geospatial analysis of Montreal BIXI demand"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn>=1.4,<2",
  "requests>=2.31,<3", "joblib>=1.3,<2", "pyarrow>=15,<20",
  "plotly>=5.20,<7", "streamlit>=1.35,<2", "sqlalchemy>=2.0,<3",
  "holidays>=0.46,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
